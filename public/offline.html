<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211d16" />
    <title>Lokl offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10100e;
        color: #fff8e8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(88vw, 420px);
        border: 1px solid rgb(255 248 232 / 0.1);
        border-radius: 22px;
        background: #211d16;
        padding: 28px;
        box-shadow: 0 14px 40px rgb(0 0 0 / 0.34);
      }
      p { color: #b9ad96; line-height: 1.6; }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 16px;
        background: #f4b63f;
        color: #171510;
        padding: 0 18px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Lokl can open once your connection is back. Previously cached app assets are kept ready on this device.</p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
