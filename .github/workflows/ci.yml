name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx oxlint src

      - name: Build (mock mode)
        run: VITE_APP_MODE=mock npm run build

      # Dummy-but-present values only — proves the production gate (Step 1, LOKL-008/009)
      # and the mock-code dead-code-elimination (LOKL-017) still hold. Never real secrets.
      - name: Build (supabase mode, dummy credentials)
        env:
          VITE_APP_MODE: supabase
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
          VITE_HCAPTCHA_SITE_KEY: dummy-hcaptcha-site-key
          VITE_GOOGLE_MAPS_API_KEY: dummy-maps-key
          VITE_FIREBASE_API_KEY: dummy-fb-key
          VITE_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: example-project
          VITE_FIREBASE_STORAGE_BUCKET: example.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
          VITE_FIREBASE_APP_ID: "1:123456789:web:abcdef"
          VITE_FIREBASE_VAPID_KEY: dummy-vapid-key
          VITE_REQUIRE_OTP_GUARD: "true"
          VITE_IMAGE_MODERATION_REQUIRED: "true"
        run: npm run build

      - name: Rebuild mock-mode dist for e2e (last build above was supabase-mode)
        run: VITE_APP_MODE=mock npm run build

      - name: Install Playwright Chrome
        run: npx --yes playwright install --with-deps chrome

      - name: Start mock-mode dev server
        run: |
          VITE_APP_MODE=mock npx vite --port 5173 --strictPort &
          npx wait-on http://localhost:5173

      - name: Smoke e2e (mock mode)
        env:
          VITE_APP_MODE: mock
          # Both e2e scripts default to 127.0.0.1, which never resolves on this
          # runner (Vite binds to `localhost`) — same mismatch as the dev-server
          # step above.
          RELEASE_E2E_BASE_URL: http://localhost:5173
        run: npm run test:smoke

      - name: Release e2e (mock mode)
        env:
          VITE_APP_MODE: mock
          RELEASE_E2E_BASE_URL: http://localhost:5173
        run: npm run test:release
